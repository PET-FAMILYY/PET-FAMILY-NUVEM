<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010" font-family="Segoe UI, Arial, sans-serif">
  <title>Pet Family API - Arquitetura de implantação e fluxo CI/CD (Sprint 4)</title>
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c63b7"/></marker>
    <style>
      .zone{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}
      .zt{font-size:17px;font-weight:700;fill:#0f172a}
      .box{fill:#fff;stroke:#475569;stroke-width:1.5}
      .pend{fill:#fff;stroke:#b45309;stroke-width:2;stroke-dasharray:7 5}
      .t{font-size:13px;fill:#0f172a}
      .tb{font-size:14px;font-weight:700;fill:#0f172a}
      .ts{font-size:11.5px;fill:#334155}
      .tag{fill:#e2e8f0;stroke:#64748b;stroke-width:1}
      .tagt{font-size:11px;font-weight:700;fill:#1e293b}
      .ord{fill:#d9480f}
      .ordt{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle}
      .deliv{stroke:#d9480f;stroke-width:2.6;fill:none;marker-end:url(#arrO)}
      .usage{stroke:#1c63b7;stroke-width:2.6;fill:none;marker-end:url(#arrB)}
      .person{fill:#cbd5e1;stroke:#475569;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1600" height="1010" fill="#ffffff"/>
  <text x="20" y="34" font-size="24" font-weight="700" fill="#0f172a">Pet Family API — Arquitetura de implantação e fluxo CI/CD (Sprint 4)</text>
  <text x="20" y="56" font-size="13" fill="#475569">Laranja = caminho de ENTREGA do software (numerado 1–10) · Azul = caminho de USO da aplicação · Todos os componentes foram criados e validados em execução real (pipeline 20261103.3)</text>

  <!-- ===== Zona: Desenvolvimento ===== -->
  <rect class="zone" x="20" y="80" width="260" height="330" rx="12"/>
  <text class="zt" x="36" y="106">Estação do desenvolvedor</text>
  <circle class="person" cx="150" cy="146" r="16"/>
  <path class="person" d="M120,196 q0,-34 30,-34 q30,0 30,34 z"/>
  <text class="tb" x="150" y="216" text-anchor="middle">Desenvolvedor</text>
  <rect class="box" x="50" y="232" width="200" height="54" rx="8"/>
  <text class="tb" x="150" y="256" text-anchor="middle">IDE</text>
  <text class="ts" x="150" y="274" text-anchor="middle">IntelliJ / VS Code · JDK 17 · Maven</text>
  <rect class="box" x="50" y="324" width="200" height="54" rx="8"/>
  <text class="tb" x="150" y="348" text-anchor="middle">Git local</text>
  <text class="ts" x="150" y="366" text-anchor="middle">commit na branch master</text>

  <!-- ===== Zona: GitHub ===== -->
  <rect class="zone" x="330" y="80" width="250" height="330" rx="12"/>
  <text class="zt" x="346" y="106">GitHub</text>
  <rect class="box" x="352" y="124" width="206" height="150" rx="8"/>
  <text class="tb" x="455" y="148" text-anchor="middle">Repositório do código</text>
  <text class="ts" x="455" y="170" text-anchor="middle">branch master (trigger do CI)</text>
  <text class="ts" x="455" y="190" text-anchor="middle">pom.xml · src/ · Dockerfile</text>
  <text class="ts" x="455" y="208" text-anchor="middle">azure-pipelines.yml</text>
  <text class="ts" x="455" y="226" text-anchor="middle">infra/azure/*.ps1 · docs/</text>
  <rect class="tag" x="390" y="246" width="130" height="20" rx="10"/>
  <text class="tagt" x="455" y="260" text-anchor="middle">Git · GitHub</text>
  <rect class="box" x="352" y="296" width="206" height="90" rx="8"/>
  <text class="tb" x="455" y="320" text-anchor="middle">Webhook / GitHub App</text>
  <text class="ts" x="455" y="340" text-anchor="middle">notifica o Azure Pipelines</text>
  <text class="ts" x="455" y="358" text-anchor="middle">a cada push na master</text>

  <!-- ===== Zona: Azure DevOps ===== -->
  <rect class="zone" x="630" y="80" width="950" height="470" rx="12"/>
  <text class="zt" x="646" y="106">Azure DevOps — projeto "Sprint 4 – Azure DevOps" (Private · Git · Agile)</text>

  <!-- CI -->
  <rect class="box" style="stroke-width:2.5" x="650" y="124" width="380" height="412" rx="10"/>
  <text class="tb" x="668" y="150">ESTÁGIO CI — Build e testes</text>
  <rect class="tag" x="880" y="134" width="130" height="20" rx="10"/>
  <text class="tagt" x="945" y="148" text-anchor="middle">Azure Pipelines</text>
  <text class="t" x="668" y="184">4  Checkout + JDK 17 + cache Maven</text>
  <text class="ts" x="688" y="201">Maven@4 restaura dependências</text>
  <text class="t" x="668" y="236">5  mvn verify: compila e roda os testes</text>
  <text class="ts" x="688" y="253">JUnit + MockMvc (H2) · migrations validadas no PostgreSQL do Azure</text>
  <text class="ts" x="688" y="269">falhou? → CD não executa</text>
  <text class="t" x="668" y="304">6  Publica resultados dos testes (aba Tests)</text>
  <text class="ts" x="688" y="321">Surefire XML → JUnit no Azure DevOps</text>
  <text class="t" x="668" y="356">7  Gera app.jar (+ build-info.txt) e publica</text>
  <text class="ts" x="688" y="373">artefato do pipeline "petfamily-jar"</text>
  <rect class="tag" x="668" y="400" width="170" height="20" rx="10"/><text class="tagt" x="753" y="414" text-anchor="middle">Maven 3.9 · JDK 17</text>
  <rect class="tag" x="846" y="400" width="164" height="20" rx="10"/><text class="tagt" x="928" y="414" text-anchor="middle">JUnit 5 · MockMvc</text>
  <text class="ts" x="668" y="452">Agente: ubuntu-latest (Microsoft-hosted, 1 job gratuito)</text>
  <text class="ts" x="668" y="470">Trigger: push em master (e main), sem filtro de paths</text>
  <text class="ts" x="668" y="488">Gatilho: GitHub App do Azure Pipelines</text>

  <!-- Artefatos -->
  <rect class="box" style="stroke-width:2.5" x="1060" y="124" width="170" height="250" rx="10"/>
  <text class="tb" x="1145" y="150" text-anchor="middle">Artefato</text>
  <text class="ts" x="1145" y="168" text-anchor="middle">(Azure Pipelines Artifacts)</text>
  <rect class="box" x="1076" y="186" width="138" height="116" rx="8"/>
  <text class="tb" x="1145" y="210" text-anchor="middle">petfamily-jar</text>
  <text class="ts" x="1145" y="232" text-anchor="middle">app.jar</text>
  <text class="ts" x="1145" y="250" text-anchor="middle">build-info.txt</text>
  <text class="ts" x="1145" y="272" text-anchor="middle">versionado pelo</text>
  <text class="ts" x="1145" y="288" text-anchor="middle">Build.BuildNumber</text>
  <text class="ts" x="1145" y="334" text-anchor="middle">Sem registry: não há</text>
  <text class="ts" x="1145" y="350" text-anchor="middle">imagem Docker no deploy</text>

  <!-- CD -->
  <rect class="box" style="stroke-width:2.5" x="1260" y="124" width="300" height="292" rx="10"/>
  <text class="tb" x="1278" y="150">ESTÁGIO CD</text>
  <rect class="tag" x="1424" y="134" width="124" height="20" rx="10"/>
  <text class="tagt" x="1486" y="148" text-anchor="middle">Azure Pipelines</text>
  <text class="t" x="1278" y="184">8  Inicia sozinho se o CI passou</text>
  <text class="ts" x="1298" y="201">baixa o artefato da MESMA execução</text>
  <text class="t" x="1278" y="236">9  Deploy do app.jar</text>
  <text class="ts" x="1298" y="253">task AzureWebApp@1 (Linux, Java 17)</text>
  <text class="t" x="1278" y="288">10 Smoke test</text>
  <text class="ts" x="1298" y="305">/actuator/health = 200</text>
  <text class="ts" x="1298" y="321">/actuator/info = buildId deste build</text>
  <text class="ts" x="1278" y="352">Environment "petfamily-sprint4"</text>
  <text class="ts" x="1278" y="368">sem aprovação manual</text>
  <rect class="tag" x="1278" y="382" width="150" height="20" rx="10"/><text class="tagt" x="1353" y="396" text-anchor="middle">AzureWebApp@1</text>

  <!-- Service connection -->
  <rect class="box" style="stroke-width:2.5" x="1260" y="440" width="300" height="96" rx="10"/>
  <text class="tb" x="1278" y="466">Service Connection (ARM)</text>
  <text class="ts" x="1278" y="486">"sc-azure-sprint4" · escopo: Resource Group</text>
  <text class="ts" x="1278" y="504">credencial gerida pelo Azure DevOps</text>
  <text class="ts" x="1278" y="522">(nenhum segredo no repositório)</text>

  <!-- ===== Zona: Microsoft Azure ===== -->
  <rect class="zone" x="630" y="590" width="950" height="395" rx="12"/>
  <text class="zt" x="646" y="616">Microsoft Azure — Resource Group rg-petfamily-sprint4</text>
  <text class="ts" x="1568" y="616" text-anchor="end">provisionado e em uso pelo pipeline</text>

  <rect class="box" x="650" y="634" width="560" height="334" rx="10" style="stroke-width:2.5"/>
  <text class="tb" x="668" y="660">Azure App Service (Linux, plano B1) — Web App "petfamily-sprint4-api"</text>
  <rect class="tag" x="668" y="670" width="196" height="20" rx="10"/><text class="tagt" x="766" y="684" text-anchor="middle">Azure App Service · Java SE 17</text>
  <text class="ts" x="882" y="684">HTTPS only · perfil Spring "prod"</text>
  <rect class="box" x="668" y="704" width="524" height="248" rx="8"/>
  <text class="tb" x="684" y="728">app.jar — Spring Boot 3.2.5</text>
  <rect class="box" x="684" y="744" width="236" height="46" rx="6"/><text class="t" x="802" y="764" text-anchor="middle">Controllers REST + Swagger UI</text><text class="ts" x="802" y="780" text-anchor="middle">/auth /pets /tutores /consultas ...</text>
  <rect class="box" x="936" y="744" width="240" height="46" rx="6"/><text class="t" x="1056" y="764" text-anchor="middle">Spring Security + JWT</text><text class="ts" x="1056" y="780" text-anchor="middle">perfis TUTOR / VETERINARIO</text>
  <rect class="box" x="684" y="802" width="236" height="46" rx="6"/><text class="t" x="802" y="822" text-anchor="middle">Services (regras de negócio)</text><text class="ts" x="802" y="838" text-anchor="middle">cache Caffeine</text>
  <rect class="box" x="936" y="802" width="240" height="46" rx="6"/><text class="t" x="1056" y="822" text-anchor="middle">Spring Data JPA / Hibernate</text><text class="ts" x="1056" y="838" text-anchor="middle">ddl-auto=validate</text>
  <rect class="box" x="684" y="860" width="236" height="46" rx="6"/><text class="t" x="802" y="880" text-anchor="middle">Flyway</text><text class="ts" x="802" y="896" text-anchor="middle">migrations V1–V7 na inicialização</text>
  <rect class="box" x="936" y="860" width="240" height="46" rx="6"/><text class="t" x="1056" y="880" text-anchor="middle">Actuator</text><text class="ts" x="1056" y="896" text-anchor="middle">/actuator/health · /actuator/info</text>
  <text class="ts" x="684" y="934">App Settings (segredos): DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET, SPRING_PROFILES_ACTIVE</text>

  <rect class="box" x="1300" y="680" width="260" height="262" rx="10" style="stroke-width:2.5"/>
  <text class="tb" x="1430" y="706" text-anchor="middle">Banco em nuvem</text>
  <rect class="tag" x="1318" y="716" width="224" height="20" rx="10"/><text class="tagt" x="1430" y="730" text-anchor="middle">Azure Database for PostgreSQL 16</text>
  <text class="ts" x="1430" y="756" text-anchor="middle">Flexible Server · Burstable B1ms</text>
  <rect class="box" x="1316" y="768" width="228" height="124" rx="8"/>
  <text class="tb" x="1430" y="790" text-anchor="middle">database "petfamily"</text>
  <text class="ts" x="1430" y="810" text-anchor="middle">usuarios · tutores · pets</text>
  <text class="ts" x="1430" y="826" text-anchor="middle">consultas · consulta_slots</text>
  <text class="ts" x="1430" y="842" text-anchor="middle">lembretes · interacoes_ia</text>
  <text class="ts" x="1430" y="858" text-anchor="middle">flyway_schema_history</text>
  <text class="ts" x="1430" y="880" text-anchor="middle">SSL obrigatório (sslmode=require)</text>
  <text class="ts" x="1430" y="912" text-anchor="middle">Firewall: só IPs do Web App</text>
  <text class="ts" x="1430" y="928" text-anchor="middle">+ IP do apresentador (SELECTs)</text>

  <!-- ===== Zona: Usuário final ===== -->
  <rect class="zone" x="20" y="590" width="560" height="395" rx="12"/>
  <text class="zt" x="36" y="616">Uso da aplicação</text>
  <circle class="person" cx="110" cy="690" r="18"/>
  <path class="person" d="M76,744 q0,-38 34,-38 q34,0 34,38 z"/>
  <text class="tb" x="110" y="766" text-anchor="middle">Usuário final</text>
  <text class="ts" x="110" y="783" text-anchor="middle">(tutor / veterinário)</text>
  <rect class="box" x="250" y="650" width="310" height="62" rx="8"/>
  <text class="tb" x="405" y="674" text-anchor="middle">Navegador · Swagger UI</text>
  <text class="ts" x="405" y="694" text-anchor="middle">/swagger-ui/index.html no endereço do Web App</text>
  <rect class="box" x="250" y="730" width="310" height="62" rx="8"/>
  <text class="tb" x="405" y="754" text-anchor="middle">Postman / curl / app mobile (Expo)</text>
  <text class="ts" x="405" y="774" text-anchor="middle">CRUD via API REST + token Bearer</text>
  <rect class="box" x="250" y="830" width="310" height="62" rx="8"/>
  <text class="tb" x="405" y="854" text-anchor="middle">Cliente SQL (psql / DBeaver)</text>
  <text class="ts" x="405" y="874" text-anchor="middle">SELECT direto no banco · evidência do CRUD</text>

  <!-- ===== Setas de ENTREGA (laranja, numeradas) ===== -->
  <path class="deliv" d="M232,190 L232,230"/>                                   <!-- 1 desenvolvedor -> IDE -->
  <path class="deliv" d="M150,288 L150,322"/>                                   <!-- IDE -> Git local -->
  <path class="deliv" d="M252,351 L300,351 L300,200 L350,200"/>                 <!-- 2 git push -> GitHub -->
  <path class="deliv" d="M455,276 L455,294"/>                                   <!-- repositório -> webhook -->
  <path class="deliv" d="M558,341 L604,341 L604,330 L648,330"/>                 <!-- 3 webhook -> CI -->
  <path class="deliv" d="M1032,244 L1058,244"/>                                 <!-- 7 CI -> artefato -->
  <path class="deliv" d="M1232,244 L1258,244"/>                                 <!-- 8 artefato -> CD -->
  <path class="deliv" d="M1410,418 L1410,438"/>                                 <!-- CD -> service connection -->
  <path class="deliv" d="M1290,538 L1290,566 L1150,566 L1150,632"/>             <!-- 9 deploy -> Web App -->
  <path class="deliv" d="M1560,300 L1570,300 L1570,582 L1195,582 L1195,632" stroke-dasharray="6 4"/> <!-- 10 smoke test -->

  <circle class="ord" cx="232" cy="210" r="12"/><text class="ordt" x="232" y="215">1</text>
  <circle class="ord" cx="300" cy="275" r="12"/><text class="ordt" x="300" y="280">2</text>
  <circle class="ord" cx="604" cy="318" r="12"/><text class="ordt" x="604" y="323">3</text>
  <circle class="ord" cx="1045" cy="214" r="12"/><text class="ordt" x="1045" y="219">7</text>
  <circle class="ord" cx="1245" cy="214" r="12"/><text class="ordt" x="1245" y="219">8</text>
  <circle class="ord" cx="1222" cy="566" r="12"/><text class="ordt" x="1222" y="571">9</text>
  <circle class="ord" cx="1500" cy="582" r="12"/><text class="ordt" x="1500" y="587">10</text>
  <text class="ts" x="1000" y="562" text-anchor="middle" fill="#d9480f">deploy do app.jar via Service Connection</text>
  <text class="ts" x="1290" y="578" fill="#d9480f">GET /actuator/health e /info</text>
  <text class="ts" x="668" y="506">Etapas 4, 5 e 6 acontecem dentro deste agente.</text>

  <!-- ===== Setas de USO (azul) ===== -->
  <path class="usage" d="M146,742 L180,742 L180,682 L248,682"/>                 <!-- usuário -> navegador -->
  <path class="usage" d="M180,742 L248,761"/>                                   <!-- usuário -> Postman/curl -->
  <path class="usage" d="M180,742 L214,742 L214,861 L248,861"/>                 <!-- usuário/apresentador -> cliente SQL -->
  <path class="usage" d="M562,681 L612,681 L612,740 L648,740"/>                 <!-- navegador -> Web App -->
  <path class="usage" d="M562,761 L596,761 L596,758 L648,758"/>                 <!-- Postman -> Web App -->
  <path class="usage" d="M1194,826 L1298,826"/>                                 <!-- Web App -> PostgreSQL -->
  <path class="usage" d="M562,861 L600,861 L600,988 L1430,988 L1430,944"/>      <!-- cliente SQL -> PostgreSQL -->
  <text class="ts" x="568" y="674" fill="#1c63b7">HTTPS</text>
  <text class="ts" x="1198" y="816" fill="#1c63b7">JDBC + SSL</text>
  <text class="ts" x="1198" y="846" fill="#1c63b7">Flyway: schema</text>
  <text class="ts" x="760" y="1003" fill="#1c63b7">porta 5432 · SSL · liberada só para o IP do apresentador</text>
</svg>
